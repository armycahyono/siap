<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SIAP Mobile - SMK PGRI 1 NGAWI</title>

    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SIAP Mobile">

    <!-- Base HREF for SPA Navigation -->
    <base href="/mobile/">

    <link rel="apple-touch-icon" href="assets/logo.png">
    <link rel="manifest" href="manifest.json">

    <!-- Fonts & Tailwind CSS CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Mobile UI Styles -->
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body class="flex flex-col min-h-screen">

    <!-- Top Bar: Header Dinamis Mobile -->
    <header id="mobile-top-bar" class="hidden sticky top-0 z-40 glass-header border-b border-slate-200/80 px-4 py-3">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <img src="assets/logo.png" alt="Logo SIAP" class="w-8 h-8 object-contain">
                <div>
                    <h1 id="top-bar-title" class="text-xs font-black text-slate-800 tracking-tight uppercase">
                        SIAP MOBILE
                    </h1>
                    <div class="flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">SMK PGRI 1 NGAWI</span>
                    </div>
                </div>
            </div>
            <button type="button" onclick="handleLogout()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-rose-50 text-slate-500 hover:text-rose-600 transition flex items-center justify-center" title="Keluar">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            </button>
        </div>
    </header>

    <!-- Dynamic View Container (SPA Engine) -->
    <main id="app-view-container" class="flex-1 w-full max-w-md mx-auto p-4">
        <div id="initial-app-loader" class="text-center py-24 text-xs text-slate-400">
            <svg class="animate-spin h-8 w-8 text-blue-600 mx-auto mb-3" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
            </svg>
            <span class="font-bold text-slate-600">Memuat SIAP Mobile...</span>
        </div>
    </main>

    <!-- Bottom Navigation Bar (4 Tab Utama) -->
    <nav id="mobile-bottom-nav" class="fixed bottom-0 left-0 right-0 max-w-md mx-auto glass-bottom-nav border-t border-slate-200/90 shadow-2xl px-3 flex justify-around items-center z-50 rounded-t-2xl hidden">
        <!-- Tab Beranda -->
        <button type="button" data-tab-nav="dashboard" onclick="SIAP_ROUTER.navigate('/dashboard')" class="flex flex-col items-center justify-center flex-1 py-1.5 text-blue-600 transition-colors">
            <svg class="tab-icon w-5 h-5 mb-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            <span class="tab-label text-[10px] font-bold">Beranda</span>
        </button>

        <!-- Tab Presensi -->
        <button type="button" data-tab-nav="attendance" onclick="SIAP_ROUTER.navigate('/attendance')" class="flex flex-col items-center justify-center flex-1 py-1.5 text-slate-400 hover:text-slate-600 transition-colors">
            <svg class="tab-icon w-5 h-5 mb-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            <span class="tab-label text-[10px] font-medium">Presensi</span>
        </button>

        <!-- Tab Tugas -->
        <button type="button" data-tab-nav="tasks" onclick="SIAP_ROUTER.navigate('/tasks')" class="flex flex-col items-center justify-center flex-1 py-1.5 text-slate-400 hover:text-slate-600 transition-colors">
            <svg class="tab-icon w-5 h-5 mb-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
            <span class="tab-label text-[10px] font-medium">Tugas</span>
        </button>

        <!-- Tab Profil -->
        <button type="button" data-tab-nav="profile" onclick="SIAP_ROUTER.navigate('/profile')" class="flex flex-col items-center justify-center flex-1 py-1.5 text-slate-400 hover:text-slate-600 transition-colors">
            <svg class="tab-icon w-5 h-5 mb-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            <span class="tab-label text-[10px] font-medium">Profil</span>
        </button>
    </nav>

    <!-- Global Toast Container -->
    <div id="toast-container" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 w-full max-w-xs pointer-events-none px-4"></div>

    <!-- Application Scripts -->
    <script src="js/api.js"></script>
    <script src="js/router.js"></script>
    <script src="js/app.js"></script>

    <!-- Clean up any active service workers -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (let registration of registrations) {
                    registration.unregister();
                }
            });
        }
    </script>
</body>
</html>
