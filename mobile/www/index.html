<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SIAP Mobile - SMK PGRI KRAS</title>

    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SIAP Mobile">

    <!-- Base HREF for SPA Navigation -->
    <base href="/mobile/">

    <link rel="apple-touch-icon" href="assets/logo.png">
    <link rel="manifest" href="manifest.json">

    <!-- Fonts & Tailwind CSS CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Mobile UI Styles -->
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body class="flex flex-col min-h-screen">

    <!-- Top Bar: Header Dinamis Mobile -->
    <header id="mobile-top-bar" class="hidden sticky top-0 z-40 glass-header border-b border-slate-200/80 px-4 py-3">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <button id="top-bar-back-btn" type="button" onclick="history.back()" class="hidden w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition active:scale-95" title="Kembali">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
                </button>
                <img id="top-bar-logo" src="assets/logo.png" alt="Logo SIAP" class="w-8 h-8 object-contain">
                <div>
                    <h1 id="top-bar-title" class="text-xs font-black text-slate-800 tracking-tight uppercase">
                        SIAP MOBILE
                    </h1>
                    <div class="flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">SMK PGRI KRAS</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <!-- Tombol Lonceng Notifikasi -->
                <button type="button" onclick="openNotificationModal()" class="relative w-8 h-8 rounded-full bg-slate-100 hover:bg-blue-50 text-slate-600 hover:text-blue-600 transition flex items-center justify-center shadow-xs" title="Pemberitahuan & Tugas">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
                    <!-- Red Unread Dot / Counter Badge -->
                    <span id="top-notif-badge" class="hidden absolute -top-1 -right-1 min-w-[16px] h-4 px-1 rounded-full bg-rose-600 text-[9px] font-black text-white flex items-center justify-center shadow-xs border-2 border-white">0</span>
                </button>

                <!-- Foto Profil User (Klik menuju Profil) -->
                <button type="button" onclick="SIAP_ROUTER.navigate('/profile')" class="relative flex-shrink-0" title="Profil Anda">
                    <img id="top-user-avatar" src="assets/logo.png" alt="Profil" class="w-8 h-8 rounded-full object-cover border-2 border-blue-500 shadow-xs bg-slate-100">
                </button>
            </div>
        </div>
    </header>

    <!-- Dynamic View Container (SPA Engine) -->
    <main id="app-view-container" class="flex-1 w-full max-w-md mx-auto p-4">
        <div id="initial-app-loader" class="text-center py-24 text-xs text-slate-400">
            <svg class="animate-spin h-8 w-8 text-blue-600 mx-auto mb-3" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
            </svg>
            <span class="font-bold text-slate-600">Memuat SIAP Mobile...</span>
        </div>
    </main>

    <!-- Bottom Navigation Bar (Cupertino 5-Tab Floating Capsule) -->
    <nav id="mobile-bottom-nav" class="fixed bottom-3 left-3 right-3 max-w-md mx-auto glass-bottom-nav px-3 py-1 flex justify-around items-center z-50 rounded-full hidden">
        <!-- 1. Tab Beranda -->
        <button type="button" data-tab-nav="dashboard" onclick="SIAP_ROUTER.navigate('/dashboard')" class="flex flex-col items-center justify-center flex-1 py-1 text-blue-600 transition-colors">
            <svg class="tab-icon w-5 h-5 mb-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            <span class="tab-label text-[10px] font-bold">Beranda</span>
        </button>

        <!-- 2. Tab KBM -->
        <button type="button" data-tab-nav="kbm" onclick="SIAP_ROUTER.navigate('/kbm')" class="flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-slate-600 transition-colors">
            <svg class="tab-icon w-5 h-5 mb-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
            <span class="tab-label text-[10px] font-medium">KBM</span>
        </button>

        <!-- 3. Tab Absen (Tengah Menonjol / Elevated Action Circle) -->
        <button type="button" data-tab-nav="attendance" onclick="SIAP_ROUTER.navigate('/attendance')" class="mobile-nav-action flex flex-col items-center justify-center flex-1 py-0 text-slate-500 transition-colors">
            <div class="action-circle">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </div>
            <span class="tab-label text-[10px] font-bold text-slate-600 mt-[-2px]">Absen</span>
        </button>

        <!-- 4. Tab Tugas -->
        <button type="button" data-tab-nav="tasks" onclick="SIAP_ROUTER.navigate('/tasks')" class="flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-slate-600 transition-colors">
            <svg class="tab-icon w-5 h-5 mb-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
            <span class="tab-label text-[10px] font-medium">Tugas</span>
        </button>

        <!-- 5. Tab Profil -->
        <button type="button" data-tab-nav="profile" onclick="SIAP_ROUTER.navigate('/profile')" class="flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-slate-600 transition-colors">
            <svg class="tab-icon w-5 h-5 mb-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            <span class="tab-label text-[10px] font-medium">Profil</span>
        </button>
    </nav>

    <!-- Cupertino Modal Sheet: Pemberitahuan & Tugas (Global) -->
    <div id="modal-notifications" class="fixed inset-0 z-[60] bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 hidden transition-opacity">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl shadow-2xl flex flex-col max-h-[85vh] overflow-hidden">
            <!-- Modal Header -->
            <div class="p-4 bg-gradient-to-r from-[#0f2744] to-[#1d4ed8] text-white flex items-center justify-between relative rounded-t-3xl">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-full bg-white/15 flex items-center justify-center text-white">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
                    </div>
                    <div>
                        <div class="flex items-center gap-1.5">
                            <h3 class="text-xs font-black tracking-tight">Pemberitahuan &amp; Tugas</h3>
                            <span id="notif-modal-counter" class="hidden px-2 py-0.2 rounded-full text-[9px] font-bold bg-rose-500 text-white">0</span>
                        </div>
                        <p id="notif-modal-sub" class="text-[10px] text-blue-200 mt-0.5">Memuat pemberitahuan...</p>
                    </div>
                </div>
                <button type="button" onclick="closeNotificationModal()" class="w-7 h-7 rounded-full bg-white/10 hover:bg-white/20 text-white text-base font-bold flex items-center justify-center transition">&times;</button>
            </div>

            <!-- List Notifikasi Scrollable -->
            <div id="notif-list-container" class="flex-1 overflow-y-auto p-4 space-y-2.5">
                <div class="text-center py-8 text-xs text-slate-400">
                    <svg class="animate-spin h-5 w-5 text-blue-600 mx-auto mb-2" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path></svg>
                    Memuat data pemberitahuan...
                </div>
            </div>
        </div>
    </div>

    <!-- Global Toast Container -->
    <div id="toast-container" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 w-full max-w-xs pointer-events-none px-4"></div>

    <!-- Application Scripts -->
    <script src="js/api.js"></script>
    <script src="js/router.js"></script>
    <script src="js/app.js"></script>

    <!-- Clean up any active service workers -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (let registration of registrations) {
                    registration.unregister();
                }
            });
        }
    </script>
</body>
</html>
