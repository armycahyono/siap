<div class="space-y-3.5 pb-24">
    <!-- 1. Header Navigasi Bulan & Tahun -->
    <div class="card-elevated p-3.5 bg-gradient-to-r from-[#0f2744] via-[#103a6b] to-[#1d4ed8] text-white shadow-md rounded-2xl">
        <div class="flex items-center justify-between mb-3">
            <button type="button" id="cal-btn-prev" onclick="changeCalendarMonth(-1)" class="w-8 h-8 rounded-full bg-white/15 hover:bg-white/25 active:scale-95 flex items-center justify-center text-white transition" title="Bulan Sebelumnya">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div class="text-center">
                <span id="cal-academic-year" class="text-[9px] font-black uppercase tracking-wider text-blue-200">TA --/--</span>
                <h3 id="cal-month-title" class="text-base font-black tracking-tight text-white mt-0.5">Memuat Kalender...</h3>
            </div>
            <button type="button" id="cal-btn-next" onclick="changeCalendarMonth(1)" class="w-8 h-8 rounded-full bg-white/15 hover:bg-white/25 active:scale-95 flex items-center justify-center text-white transition" title="Bulan Berikutnya">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
            </button>
        </div>

        <!-- 3 Kartu Ringkasan Hari Efektif / Libur Bulan Ini -->
        <div class="grid grid-cols-3 gap-2 pt-2 border-t border-white/10 text-center">
            <div class="bg-white/10 backdrop-blur-sm rounded-xl py-1.5 px-2">
                <p class="text-[9px] font-bold text-blue-100 uppercase tracking-wider">Hari Efektif</p>
                <p id="cal-stat-effective" class="text-sm font-black text-emerald-300 font-mono mt-0.5">0</p>
            </div>
            <div class="bg-white/10 backdrop-blur-sm rounded-xl py-1.5 px-2">
                <p class="text-[9px] font-bold text-blue-100 uppercase tracking-wider">Hari Libur</p>
                <p id="cal-stat-holiday" class="text-sm font-black text-rose-300 font-mono mt-0.5">0</p>
            </div>
            <div class="bg-white/10 backdrop-blur-sm rounded-xl py-1.5 px-2">
                <p class="text-[9px] font-bold text-blue-100 uppercase tracking-wider">Agenda</p>
                <p id="cal-stat-events" class="text-sm font-black text-amber-300 font-mono mt-0.5">0</p>
            </div>
        </div>
    </div>

    <!-- 2. Grid Kalender Interaktif -->
    <div class="card-elevated p-3 rounded-2xl bg-white shadow-xs border border-slate-100">
        <!-- Hari dalam Sepekan (Minggu s/d Sabtu) -->
        <div class="grid grid-cols-7 gap-1 text-center mb-1 text-[11px] font-bold">
            <div class="py-1 text-rose-500">Min</div>
            <div class="py-1 text-slate-600">Sen</div>
            <div class="py-1 text-slate-600">Sel</div>
            <div class="py-1 text-slate-600">Rab</div>
            <div class="py-1 text-slate-600">Kam</div>
            <div class="py-1 text-slate-600">Jum</div>
            <div class="py-1 text-slate-600">Sab</div>
        </div>

        <!-- Kotak Hari (Rendered Dinamis via JavaScript) -->
        <div id="cal-days-grid" class="grid grid-cols-7 gap-1">
            <div class="col-span-7 py-12 text-center text-xs text-slate-400">
                <svg class="animate-spin h-6 w-6 text-blue-600 mx-auto mb-2" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path></svg>
                Memuat kalender kegiatan...
            </div>
        </div>

        <!-- Legenda Dot Warna -->
        <div class="flex items-center justify-center gap-3 pt-2.5 mt-2.5 border-t border-slate-100 text-[10px] text-slate-500">
            <div class="flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-rose-500"></span> Libur
            </div>
            <div class="flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-blue-500"></span> Kurikulum
            </div>
            <div class="flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-amber-500"></span> Guru/Tugas
            </div>
            <div class="flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Kesiswaan
            </div>
        </div>
    </div>

    <!-- 3. Filter Kategori Chips -->
    <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1 text-xs">
        <button type="button" onclick="filterCalendarEvents('all')" data-cal-filter="all" class="cal-filter-btn px-3 py-1.5 rounded-full text-[11px] font-bold bg-blue-600 text-white shadow-xs shrink-0 transition">Semua</button>
        <button type="button" onclick="filterCalendarEvents('holiday')" data-cal-filter="holiday" class="cal-filter-btn px-3 py-1.5 rounded-full text-[11px] font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 shrink-0 transition">Hari Libur</button>
        <button type="button" onclick="filterCalendarEvents('curriculum')" data-cal-filter="curriculum" class="cal-filter-btn px-3 py-1.5 rounded-full text-[11px] font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 shrink-0 transition">Kurikulum</button>
        <button type="button" onclick="filterCalendarEvents('teacher')" data-cal-filter="teacher" class="cal-filter-btn px-3 py-1.5 rounded-full text-[11px] font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 shrink-0 transition">Tugas Guru</button>
    </div>

    <!-- 4. Rincian Agenda Tanggal Terpilih / Bulan Ini -->
    <div class="space-y-2">
        <div class="flex items-center justify-between px-1">
            <div>
                <h4 id="cal-events-header-title" class="text-xs font-black text-slate-800 uppercase tracking-wider">Agenda Kegiatan</h4>
                <p id="cal-events-header-sub" class="text-[10px] text-slate-500">Menampilkan agenda bulan ini</p>
            </div>
            <button type="button" id="cal-btn-reset-date" onclick="resetCalendarSelectedDate()" class="hidden text-[10px] font-bold text-blue-600 hover:underline">
                Lihat Semua Bulan Ini
            </button>
        </div>

        <div id="cal-events-container" class="space-y-2">
            <!-- Rendered by JS -->
        </div>
    </div>

    <!-- 5. FAB Tambah Kegiatan (Bagi Guru Kurikulum / Admin) -->
    <div id="cal-fab-container" class="hidden fixed bottom-20 right-4 z-40">
        <button type="button" onclick="openAddEventModal()" class="w-12 h-12 rounded-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-xl flex items-center justify-center hover:scale-105 active:scale-95 transition" title="Tambah Agenda">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
        </button>
    </div>

    <!-- Modal Dialog: Tambah Kegiatan Baru -->
    <div id="modal-add-calendar-event" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl shadow-2xl flex flex-col max-h-[85vh] overflow-hidden">
            <div class="p-4 bg-gradient-to-r from-[#0f2744] to-[#1d4ed8] text-white flex items-center justify-between rounded-t-3xl">
                <div class="flex items-center gap-2">
                    <svg class="w-5 h-5 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    <h3 class="text-xs font-black tracking-tight">Tambah Kegiatan Sekolah</h3>
                </div>
                <button type="button" onclick="closeAddEventModal()" class="w-7 h-7 rounded-full bg-white/10 hover:bg-white/20 text-white font-bold flex items-center justify-center transition">&times;</button>
            </div>
            <form id="form-add-calendar-event" onsubmit="submitAddCalendarEvent(event)" class="p-4 space-y-3 overflow-y-auto">
                <div>
                    <label class="block text-[11px] font-bold text-slate-700 mb-1">Nama / Judul Kegiatan <span class="text-rose-500">*</span></label>
                    <input type="text" id="add-event-title" required class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:border-blue-500" placeholder="Contoh: Asesmen Sumatif Akhir Semester">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-700 mb-1">Kategori Kegiatan <span class="text-rose-500">*</span></label>
                    <select id="add-event-category" required class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:border-blue-500">
                        <option value="kegiatan_kurikulum">Agenda Kurikulum</option>
                        <option value="tugas_guru">Tugas & Pengingat Guru</option>
                        <option value="kts">Kegiatan Tengah Semester (KTS)</option>
                        <option value="ke">Kegiatan Ekstrakurikuler (KE)</option>
                        <option value="lhb">Libur Hari Besar (LHB)</option>
                        <option value="lu">Libur Umum (LU)</option>
                        <option value="cb">Cuti Bersama (CB)</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-700 mb-1">Tanggal Mulai <span class="text-rose-500">*</span></label>
                        <input type="date" id="add-event-start-date" required class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-700 mb-1">Tanggal Selesai</label>
                        <input type="date" id="add-event-end-date" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-700 mb-1">Lokasi Kegiatan</label>
                    <input type="text" id="add-event-location" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:border-blue-500" placeholder="Contoh: Aula SMK PGRI Kras">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-700 mb-1">Keterangan / Deskripsi</label>
                    <textarea id="add-event-description" rows="2" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:border-blue-500" placeholder="Catatan tambahan..."></textarea>
                </div>
                <div class="pt-2">
                    <button type="submit" id="btn-submit-add-event" class="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 active:scale-95 text-white text-xs font-bold transition shadow-md">
                        Simpan Agenda
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
