<div class="space-y-3.5 pb-24">
    <!-- 1. Header Navigasi Bulan & Tahun -->
    <div class="card-elevated p-3.5 bg-gradient-to-r from-[#0f2744] via-[#103a6b] to-[#1d4ed8] text-white shadow-md rounded-2xl">
        <div class="flex items-center justify-between mb-3">
            <button type="button" id="cal-btn-prev" onclick="changeCalendarMonth(-1)" class="w-8 h-8 rounded-full bg-white/15 hover:bg-white/25 active:scale-95 flex items-center justify-center text-white transition" title="Bulan Sebelumnya">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div class="text-center">
                <span id="cal-academic-year" class="text-[9px] font-black uppercase tracking-wider text-blue-200">TA --/--</span>
                <h3 id="cal-month-title" class="text-base font-black tracking-tight text-white mt-0.5">Memuat Kalender...</h3>
            </div>
            <button type="button" id="cal-btn-next" onclick="changeCalendarMonth(1)" class="w-8 h-8 rounded-full bg-white/15 hover:bg-white/25 active:scale-95 flex items-center justify-center text-white transition" title="Bulan Berikutnya">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
            </button>
        </div>

        <!-- Kartu Ringkasan Hari Efektif / Libur Bulan Ini & Tombol Tambah Agenda -->
        <div id="cal-stats-grid" class="grid grid-cols-3 gap-2 pt-2 border-t border-white/10 text-center">
            <div class="bg-white/10 backdrop-blur-sm rounded-xl py-1.5 px-1.5">
                <p class="text-[9px] font-bold text-blue-100 uppercase tracking-wider truncate">Efektif</p>
                <p id="cal-stat-effective" class="text-sm font-black text-emerald-300 font-mono mt-0.5">0</p>
            </div>
            <div class="bg-white/10 backdrop-blur-sm rounded-xl py-1.5 px-1.5">
                <p class="text-[9px] font-bold text-blue-100 uppercase tracking-wider truncate">Libur</p>
                <p id="cal-stat-holiday" class="text-sm font-black text-rose-300 font-mono mt-0.5">0</p>
            </div>
            <div class="bg-white/10 backdrop-blur-sm rounded-xl py-1.5 px-1.5">
                <p class="text-[9px] font-bold text-blue-100 uppercase tracking-wider truncate">Agenda</p>
                <p id="cal-stat-events" class="text-sm font-black text-amber-300 font-mono mt-0.5">0</p>
            </div>
            <button type="button" id="cal-btn-add-stat" onclick="openAddEventModal()" class="hidden bg-white/10 hover:bg-white/20 active:scale-95 backdrop-blur-sm rounded-xl py-1.5 px-1.5 text-center transition flex flex-col items-center justify-center cursor-pointer border border-white/15" title="Tambah Agenda Baru">
                <p class="text-[9px] font-bold text-blue-100 uppercase tracking-wider truncate w-full">Tambah</p>
                <p class="text-sm font-black text-amber-300 font-mono mt-0.5 truncate w-full">Agenda</p>
            </button>
        </div>
    </div>

    <!-- 2. Grid Kalender Interaktif -->
    <div class="card-elevated p-3 rounded-2xl bg-white shadow-xs border border-slate-100">
        <!-- Hari dalam Sepekan (Minggu s/d Sabtu) -->
        <div class="grid grid-cols-7 gap-1 text-center mb-1 text-[11px] font-bold">
            <div class="py-1 text-rose-500">Min</div>
            <div class="py-1 text-slate-600">Sen</div>
            <div class="py-1 text-slate-600">Sel</div>
            <div class="py-1 text-slate-600">Rab</div>
            <div class="py-1 text-slate-600">Kam</div>
            <div class="py-1 text-slate-600">Jum</div>
            <div class="py-1 text-slate-600">Sab</div>
        </div>

        <!-- Kotak Hari (Rendered Dinamis via JavaScript) -->
        <div id="cal-days-grid" class="grid grid-cols-7 gap-1">
            <div class="col-span-7 py-12 text-center text-xs text-slate-400">
                <svg class="animate-spin h-6 w-6 text-blue-600 mx-auto mb-2" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path></svg>
                Memuat kalender kegiatan...
            </div>
        </div>

        <!-- Legenda Dot Warna -->
        <div class="flex items-center justify-center gap-3 pt-2.5 mt-2.5 border-t border-slate-100 text-[10px] text-slate-500">
            <div class="flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-rose-500"></span> Libur
            </div>
            <div class="flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-blue-500"></span> Kurikulum
            </div>
            <div class="flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-amber-500"></span> Guru/Tugas
            </div>
            <div class="flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Kesiswaan
            </div>
        </div>
    </div>

    <!-- 3. Filter Kategori Chips -->
    <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1 text-xs">
        <button type="button" onclick="filterCalendarEvents('all')" data-cal-filter="all" class="cal-filter-btn px-3 py-1.5 rounded-full text-[11px] font-bold bg-blue-600 text-white shadow-xs shrink-0 transition">Semua</button>
        <button type="button" onclick="filterCalendarEvents('holiday')" data-cal-filter="holiday" class="cal-filter-btn px-3 py-1.5 rounded-full text-[11px] font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 shrink-0 transition">Hari Libur</button>
        <button type="button" onclick="filterCalendarEvents('curriculum')" data-cal-filter="curriculum" class="cal-filter-btn px-3 py-1.5 rounded-full text-[11px] font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 shrink-0 transition">Kurikulum</button>
        <button type="button" onclick="filterCalendarEvents('teacher')" data-cal-filter="teacher" class="cal-filter-btn px-3 py-1.5 rounded-full text-[11px] font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 shrink-0 transition">Tugas Guru</button>
    </div>

    <!-- 4. Rincian Agenda Tanggal Terpilih / Bulan Ini -->
    <div class="space-y-2">
        <div class="flex items-center justify-between px-1">
            <div>
                <h4 id="cal-events-header-title" class="text-xs font-black text-slate-800 uppercase tracking-wider">Agenda Kegiatan</h4>
                <p id="cal-events-header-sub" class="text-[10px] text-slate-500">Menampilkan agenda bulan ini</p>
            </div>
            <button type="button" id="cal-btn-reset-date" onclick="resetCalendarSelectedDate()" class="hidden text-[10px] font-bold text-blue-600 hover:underline">
                Lihat Semua Bulan Ini
            </button>
        </div>

        <div id="cal-events-container" class="space-y-2">
            <!-- Rendered by JS -->
        </div>
    </div>
</div>
