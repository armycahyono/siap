<div class="space-y-4">
    <!-- Header Card KBM -->
    <div class="card-elevated p-4 bg-gradient-to-br from-indigo-700 to-blue-600 text-white shadow-md">
        <div class="flex items-center justify-between">
            <div>
                <span id="kbm-date-label" class="text-[10px] font-semibold text-blue-100 uppercase tracking-wider">Memuat tanggal...</span>
                <h3 class="text-base font-black tracking-tight mt-0.5">Jurnal & Presensi KBM</h3>
                <p id="kbm-status-sub" class="text-[11px] text-blue-100/90 mt-0.5">Jadwal Tatap Muka Kelas</p>
            </div>
            <div class="text-right">
                <span class="text-[10px] text-blue-100 block">Selesai / Total</span>
                <span id="kbm-progress-count" class="text-lg font-black font-mono">0 / 0</span>
            </div>
        </div>
    </div>

    <!-- Alert / Banner Jika Libur / Akhir Pekan -->
    <div id="kbm-alert-holiday" class="hidden card-elevated p-3.5 bg-amber-50 border-amber-200">
        <div class="flex items-start gap-2.5">
            <span class="text-lg mt-0.5">🏖️</span>
            <div>
                <h5 id="kbm-holiday-title" class="text-xs font-bold text-amber-900">Hari Libur / Tidak Ada KBM</h5>
                <p id="kbm-holiday-desc" class="text-[11px] text-amber-700 mt-0.5">Kegiatan belajar mengajar tatap muka ditiadakan hari ini.</p>
            </div>
        </div>
    </div>

    <!-- Daftar Jadwal Mengajar Hari Ini -->
    <div>
        <div class="flex items-center justify-between mb-2 px-1">
            <h4 class="text-xs font-black text-slate-800 uppercase tracking-wider">Jadwal Mengajar Anda</h4>
            <span class="text-[10px] text-slate-400 font-semibold" id="kbm-total-info">0 Jam Pelajaran</span>
        </div>

        <div id="kbm-schedules-list" class="space-y-3">
            <div class="p-6 text-center text-slate-400 text-xs">Memuat jadwal KBM...</div>
        </div>
    </div>

    <!-- Sesi Tukar Jam / Guru Pengganti (Jika Ada) -->
    <div id="kbm-swap-section" class="hidden space-y-2">
        <div class="flex items-center justify-between mb-1 px-1">
            <h4 class="text-xs font-black text-indigo-900 uppercase tracking-wider">Sesi Pengganti (Tukar Jam)</h4>
            <span class="text-[10px] text-indigo-500 font-semibold">Tugas Mengajar</span>
        </div>
        <div id="kbm-swap-list" class="space-y-2"></div>
    </div>
</div>
