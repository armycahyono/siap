<div class="min-h-[85vh] flex flex-col justify-center py-8">
    <div class="text-center mb-8">
        <img src="assets/logo.png" alt="Logo Sekolah" class="w-20 h-20 mx-auto object-contain mb-4 drop-shadow-md">
        <h2 class="text-xl font-black text-slate-800 tracking-tight">SIAP MOBILE</h2>
        <p class="text-xs text-slate-500 font-semibold mt-1">SMK PGRI 1 NGAWI</p>
        <p class="text-[11px] text-slate-400 mt-0.5">Sistem Informasi & Administrasi Presensi GTK</p>
    </div>

    <div class="card-elevated p-6 space-y-4">
        <form id="form-mobile-login" class="space-y-4">
            <div>
                <label for="login-input" class="block text-xs font-bold text-slate-700 mb-1.5">Username, Email, atau NIP / NIGS</label>
                <input type="text" id="login-input" required autofocus placeholder="Masukkan identitas akun Anda" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
            </div>

            <div>
                <label for="password-input" class="block text-xs font-bold text-slate-700 mb-1.5">Kata Sandi</label>
                <input type="password" id="password-input" required placeholder="Masukkan kata sandi" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
            </div>

            <div class="pt-2">
                <button type="submit" id="btn-login-submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow-md hover:shadow-lg active:scale-98 transition flex items-center justify-center">
                    Masuk Aplikasi
                </button>
            </div>
        </form>
    </div>

    <div class="text-center mt-8 text-[11px] text-slate-400">

    </div>
