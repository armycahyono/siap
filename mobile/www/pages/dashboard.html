<div class="space-y-3.5">
    <!-- Cupertino User Greeting Card (Frosted Deep Sapphire) -->
    <div class="card-elevated p-4 bg-gradient-to-br from-[#0f2744] via-[#103a6b] to-[#1d4ed8] text-white shadow-lg relative overflow-hidden">
        <!-- Subtle Specular Glow Background -->
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-blue-400/20 rounded-full blur-2xl pointer-events-none"></div>

        <div class="flex items-center gap-3.5 relative z-10">
            <div class="relative">
                <img id="dash-user-avatar" src="assets/default-avatar.svg" onerror="this.src='assets/default-avatar.svg'" alt="Avatar" class="w-12 h-12 rounded-full border-2 border-white/50 object-cover bg-white/20 shadow-md">
                <span class="w-3 h-3 rounded-full bg-emerald-400 border-2 border-[#103a6b] absolute bottom-0 right-0 shadow-xs"></span>
            </div>
            <div class="flex-1">
                <p id="dash-formatted-date" class="text-[10px] font-semibold text-blue-200/90 uppercase tracking-wider">Memuat tanggal...</p>
                <h3 id="dash-user-name" class="text-sm font-black tracking-tight text-white mt-0.5">Memuat nama...</h3>
                <div class="flex items-center gap-1.5 mt-1">
                    <span id="dash-user-role" class="px-2 py-0.5 bg-white/20 backdrop-blur-md rounded-md text-[9px] font-bold text-blue-100 tracking-wide uppercase">GTK</span>
                    <span class="text-[10px] text-blue-200/70">• SMK PGRI KRAS</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Attendance Today Status Card (Apple Wallet Digital Ticket Style) -->
    <div class="card-elevated p-4">
        <div class="flex items-center justify-between border-b border-slate-100/90 pb-2.5 mb-3">
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-blue-600"></span>
                <h4 class="text-xs font-black text-slate-800 uppercase tracking-wider">Presensi Kehadiran</h4>
            </div>
            <span id="dash-att-status" class="text-[10px] font-bold text-blue-600 bg-blue-50/90 px-2.5 py-0.5 rounded-full border border-blue-100">Memeriksa...</span>
        </div>
        <div class="grid grid-cols-2 gap-2.5">
            <div class="p-3 bg-slate-50/90 rounded-2xl border border-slate-100">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Jam Masuk</p>
                <p id="dash-att-in" class="text-lg font-black text-slate-800 font-mono mt-0.5">--:--</p>
            </div>
            <div class="p-3 bg-slate-50/90 rounded-2xl border border-slate-100">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Jam Pulang</p>
                <p id="dash-att-out" class="text-lg font-black text-slate-800 font-mono mt-0.5">--:--</p>
            </div>
        </div>
        <div class="mt-3">
            <button onclick="SIAP_ROUTER.navigate('/attendance')" class="w-full py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl text-xs font-bold hover:shadow-md transition flex items-center justify-center gap-1.5 shadow-xs">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                Buka Layar Presensi Geotagging
            </button>
        </div>
    </div>

    <!-- Piket Officer / Management Card -->
    <div id="dash-piket-card" class="hidden card-elevated p-3.5 bg-purple-50/70 border-purple-200/80">
        <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-2xl bg-purple-200/80 text-purple-800 flex items-center justify-center font-bold text-sm shadow-xs">
                🛡️
            </div>
            <div class="flex-1">
                <h5 id="dash-piket-title" class="text-xs font-bold text-purple-900">Meja Piket Sekolah</h5>
                <p id="dash-piket-desc" class="text-[11px] text-purple-700 leading-tight">Monitoring ketertiban, izin siswa, guru inval & log piket.</p>
            </div>
            <button onclick="SIAP_ROUTER.navigate('/tasks/piket')" class="px-3 py-1.5 bg-purple-600 hover:bg-purple-700 text-white rounded-xl text-[10px] font-bold shadow-xs active:scale-95 transition">Meja Piket</button>
        </div>
    </div>

    <!-- Agenda Sekolah Hari Ini -->
    <div id="dash-agenda-card" class="hidden card-elevated p-3.5 bg-emerald-50/70 border-emerald-200/80">
        <div class="flex items-start gap-2.5">
            <div class="w-9 h-9 rounded-2xl bg-emerald-200/80 text-emerald-800 flex items-center justify-center text-sm mt-0.5 shadow-xs">
                📅
            </div>
            <div>
                <h5 id="dash-agenda-title" class="text-xs font-bold text-emerald-900">Agenda Sekolah</h5>
                <p id="dash-agenda-desc" class="text-[11px] text-emerald-700 mt-0.5 leading-tight">Memuat agenda...</p>
            </div>
        </div>
    </div>

    <!-- Jadwal KBM Hari Ini -->
    <div>
        <div class="flex items-center justify-between mb-2 px-1">
            <h4 class="text-xs font-black text-slate-800 uppercase tracking-wider">Jadwal Mengajar Hari Ini</h4>
            <button onclick="SIAP_ROUTER.navigate('/kbm')" class="text-[10px] text-blue-600 font-bold hover:underline flex items-center gap-0.5">
                Semua KBM
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            </button>
        </div>
        <div id="dash-schedule-list" class="space-y-2">
            <!-- Rendered by initDashboard -->
            <div class="p-4 text-center text-slate-400 text-xs card-elevated">Memuat jadwal...</div>
        </div>
    </div>
</div>
