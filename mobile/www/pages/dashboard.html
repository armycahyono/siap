<div class="space-y-4">
    <!-- User Greeting Card -->
    <div class="card-elevated p-4 bg-gradient-to-br from-blue-600 to-indigo-700 text-white shadow-md">
        <div class="flex items-center gap-3.5">
            <img id="dash-user-avatar" src="assets/logo.png" alt="Avatar" class="w-12 h-12 rounded-full border-2 border-white/40 object-cover bg-white/20">
            <div>
                <p id="dash-formatted-date" class="text-[10px] font-semibold text-blue-100 uppercase tracking-wider">Memuat tanggal...</p>
                <h3 id="dash-user-name" class="text-sm font-black tracking-tight mt-0.5">Memuat nama...</h3>
                <span id="dash-user-role" class="inline-block mt-1 px-2 py-0.5 bg-white/20 rounded-md text-[9px] font-bold text-white tracking-wide uppercase">GTK</span>
            </div>
        </div>
    </div>

    <!-- Attendance Today Status Card -->
    <div class="card-elevated p-4">
        <div class="flex items-center justify-between border-b border-slate-100 pb-2.5 mb-3">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>
                <h4 class="text-xs font-bold text-slate-800 uppercase tracking-wider">Presensi Hari Ini</h4>
            </div>
            <span id="dash-att-status" class="text-[10px] font-semibold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full">Memeriksa...</span>
        </div>
        <div class="grid grid-cols-2 gap-3">
            <div class="p-3 bg-slate-50 rounded-xl border border-slate-100">
                <p class="text-[10px] font-semibold text-slate-400 uppercase">Jam Masuk</p>
                <p id="dash-att-in" class="text-base font-black text-slate-800 font-mono mt-1">--:--</p>
            </div>
            <div class="p-3 bg-slate-50 rounded-xl border border-slate-100">
                <p class="text-[10px] font-semibold text-slate-400 uppercase">Jam Pulang</p>
                <p id="dash-att-out" class="text-base font-black text-slate-800 font-mono mt-1">--:--</p>
            </div>
        </div>
        <div class="mt-3">
            <button onclick="SIAP_ROUTER.navigate('/attendance')" class="w-full py-2 bg-blue-50 text-blue-600 rounded-xl text-xs font-bold hover:bg-blue-100 transition flex items-center justify-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                Buka Layar Presensi Geotagging
            </button>
        </div>
    </div>

    <!-- Piket Officer Card (Only shown if user is piket officer today) -->
    <div id="dash-piket-card" class="hidden card-elevated p-3.5 bg-amber-50 border-amber-200">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-amber-200 text-amber-800 flex items-center justify-center font-bold text-xs">
                ⚠️
            </div>
            <div class="flex-1">
                <h5 class="text-xs font-bold text-amber-900">Petugas Piket Hari Ini</h5>
                <p class="text-[11px] text-amber-700">Anda bertugas menjaga ketertiban, izin siswa, dan log piket.</p>
            </div>
            <button onclick="SIAP_ROUTER.navigate('/tasks')" class="px-2.5 py-1 bg-amber-600 text-white rounded-lg text-[10px] font-semibold">Tugas</button>
        </div>
    </div>

    <!-- Agenda Sekolah Hari Ini -->
    <div id="dash-agenda-card" class="hidden card-elevated p-3.5 bg-emerald-50 border-emerald-200">
        <div class="flex items-start gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-emerald-200 text-emerald-800 flex items-center justify-center text-xs mt-0.5">
                📅
            </div>
            <div>
                <h5 id="dash-agenda-title" class="text-xs font-bold text-emerald-900">Agenda Sekolah</h5>
                <p id="dash-agenda-desc" class="text-[11px] text-emerald-700 mt-0.5">Memuat agenda...</p>
            </div>
        </div>
    </div>

    <!-- Jadwal KBM Hari Ini -->
    <div>
        <div class="flex items-center justify-between mb-2 px-1">
            <h4 class="text-xs font-black text-slate-800 uppercase tracking-wider">Jadwal Mengajar Hari Ini</h4>
            <span class="text-[10px] text-slate-400 font-semibold">KBM Tatap Muka</span>
        </div>
        <div id="dash-schedule-list" class="space-y-2">
            <!-- Rendered by initDashboard -->
            <div class="p-4 text-center text-slate-400 text-xs">Memuat jadwal...</div>
        </div>
    </div>
</div>
