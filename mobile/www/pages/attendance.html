<div class="space-y-4">
    <!-- Header Card Presensi (Duo Grid Compact) -->
    <div class="card-elevated p-4">
        <!-- Header & Twin-Chip Sensor Badge -->
        <div class="flex items-center justify-between pb-3 border-b border-slate-100">
            <div>
                <h3 class="text-xs font-black text-slate-800 uppercase tracking-tight">Presensi Geotagging</h3>
                <p class="text-[10px] text-slate-400 font-medium">Validasi Koordinat GPS &amp; Radius</p>
            </div>
            <!-- Terpadu: Twin-Chip Badge GPS & Radius -->
            <div class="flex items-center gap-1 bg-slate-100/90 p-1 rounded-xl border border-slate-200/70">
                <div id="badge-gps-status" class="flex items-center gap-1 px-2 py-0.5 rounded-lg bg-slate-200 text-slate-500 text-[9px] font-extrabold transition-all">
                    <span id="dot-gps-status" class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>
                    <span id="text-gps-status">GPS</span>
                </div>
                <div id="badge-radius-status" class="flex items-center gap-1 px-2 py-0.5 rounded-lg bg-slate-200 text-slate-500 text-[9px] font-extrabold transition-all">
                    <span id="dot-radius-status" class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>
                    <span id="text-radius-status">Radius</span>
                </div>
            </div>
        </div>

        <!-- Realtime Distance Bar -->
        <div class="mt-2.5 px-3 py-1.5 rounded-xl bg-slate-50 border border-slate-200/60 flex items-center justify-between text-[10px]">
            <span class="text-slate-500 font-medium flex items-center gap-1">
                <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                Jarak Sekolah:
            </span>
            <span id="att-distance-text" class="font-bold text-slate-500">Mencari lokasi perangkat...</span>
        </div>

        <!-- Dual Grid: Jam + Tombol Aksi Langsung Sejajar Kiri & Kanan (Compact & Proporsional) -->
        <div class="grid grid-cols-2 gap-2.5 mt-3">
            <!-- 1. Tombol Presensi Masuk (Kiri, Logo di Tengah) -->
            <button type="button" id="btn-att-checkin" class="p-3.5 rounded-2xl bg-gradient-to-b from-emerald-500 to-emerald-600 text-white flex flex-col items-center justify-center text-center shadow-sm hover:shadow transition active:scale-95 border border-emerald-400/40">
                <div class="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center mb-1 shadow-inner">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>
                </div>
                <span class="text-[11px] font-black uppercase tracking-tight">Presensi Masuk</span>
                <p id="att-today-in" class="text-[11px] font-black font-mono mt-0.5 text-emerald-100">--:--</p>
                <span id="sub-att-checkin" class="text-[9px] text-white/80 font-medium mt-0.5">Ketuk Rekam Masuk</span>
            </button>

            <!-- 2. Tombol Presensi Pulang (Kanan, Logo di Tengah) -->
            <button type="button" id="btn-att-checkout" class="p-3.5 rounded-2xl bg-gradient-to-b from-blue-600 to-indigo-600 text-white flex flex-col items-center justify-center text-center shadow-sm hover:shadow transition active:scale-95 border border-blue-400/40">
                <div class="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center mb-1 shadow-inner">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                </div>
                <span class="text-[11px] font-black uppercase tracking-tight">Presensi Pulang</span>
                <p id="att-today-out" class="text-[11px] font-black font-mono mt-0.5 text-blue-100">--:--</p>
                <span id="sub-att-checkout" class="text-[9px] text-white/80 font-medium mt-0.5">Ketuk Rekam Pulang</span>
            </button>
        </div>

        <!-- 3. Catatan Tambahan Opsional di Bawah Presensi Pulang -->
        <div class="mt-3">
            <details class="group rounded-2xl border border-slate-200/80 bg-slate-50/70 p-2 text-xs transition">
                <summary class="flex items-center justify-center gap-1.5 font-bold text-slate-600 cursor-pointer select-none py-1 text-center hover:text-blue-600 transition">
                    <svg class="w-3.5 h-3.5 text-slate-400 group-hover:text-blue-600 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                    <span class="text-[10px]">Tambah catatan presensi (opsional)</span>
                    <svg class="w-3 h-3 text-slate-400 group-open:rotate-180 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                </summary>
                <div class="mt-2 pt-2 border-t border-slate-200/80">
                    <input type="text" id="att-notes-input" placeholder="Contoh: Mengajar jam ke-1 / Petugas piket / Dinas luar..." maxlength="255" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium placeholder:text-slate-400">
                </div>
            </details>
        </div>

        <p class="text-[10px] text-slate-400 text-center mt-3">
            *Pastikan izin akses lokasi (GPS) diaktifkan dengan akurasi tinggi.
        </p>
    </div>

    <!-- Riwayat Presensi 7 Hari Terakhir -->
    <div class="card-elevated p-4">
        <h4 class="text-xs font-black text-slate-800 uppercase tracking-wider mb-3">Riwayat Presensi Terakhir</h4>
        <div id="att-recent-logs" class="divide-y divide-slate-100">
            <div class="text-center py-6 text-xs text-slate-400">Memuat riwayat...</div>
        </div>
    </div>
</div>
