<div class="space-y-3.5">
    <!-- Header Card -->
    <div class="card-elevated p-4 bg-gradient-to-br from-[#102d52] via-[#1e3a8a] to-[#4338ca] text-white shadow-lg relative overflow-hidden">
        <div class="absolute -top-10 -right-10 w-28 h-28 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
        <div class="relative z-10">
            <div class="flex items-center justify-between mb-2">
                <span class="px-2 py-0.5 rounded-full text-[9px] font-bold bg-white/20 text-white tracking-wide uppercase">
                    Buku Jurnal Piket
                </span>
                <span id="piket-journal-current-date" class="px-2 py-0.5 rounded-full text-[9px] font-bold bg-indigo-200 text-indigo-950 font-mono">
                    Hari Ini
                </span>
            </div>
            <h3 class="text-sm font-black tracking-tight text-white">Arsip Jurnal Piket Harian</h3>
            <p class="text-[11px] text-indigo-100/80 mt-0.5">Rekam jejak kehadiran petugas, perizinan siswa, penugasan inval, dan situasi sekolah.</p>
            
            <div class="mt-3">
                <button type="button" onclick="SIAP_ROUTER.navigate('/tasks/piket')" class="w-full py-2 bg-white hover:bg-slate-50 text-indigo-900 rounded-xl text-xs font-bold shadow-xs active:scale-95 transition flex items-center justify-center gap-1.5">
                    <span>📝</span>
                    <span>Buka / Kelola Meja Piket Hari Ini</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Filter Bulan -->
    <div class="card-elevated p-3">
        <div class="flex items-center gap-2">
            <div class="relative flex-1">
                <input type="month" id="piket-journal-filter-month" onchange="loadPiketJournalsPage(this.value)" class="w-full text-xs font-bold rounded-xl border border-slate-200 px-3 py-2 bg-slate-50 text-slate-800 focus:outline-hidden focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="button" onclick="resetPiketJournalMonthFilter()" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold active:scale-95 transition" title="Bulan Sekarang">
                Bulan Ini
            </button>
        </div>
    </div>

    <!-- Journals History List Container -->
    <div id="piket-journals-list" class="space-y-2.5">
        <div class="p-8 text-center text-xs text-slate-400 card-elevated">
            <svg class="animate-spin h-6 w-6 text-indigo-600 mx-auto mb-2" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path></svg>
            Memuat arsip jurnal piket...
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="modal-piket-journal-page-detail" onclick="if(event.target === this) closePiketJournalPageDetailModal()" class="hidden fixed inset-0 z-[160] bg-slate-900/70 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="w-full sm:max-w-md bg-white rounded-t-3xl sm:rounded-2xl p-4 max-h-[85vh] overflow-y-auto space-y-3 shadow-2xl animate-in slide-in-from-bottom duration-200">
            <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                <div>
                    <h4 id="page-journal-detail-title" class="text-xs font-black text-slate-900">Detail Jurnal</h4>
                    <p id="page-journal-detail-date" class="text-[10px] text-slate-400 font-mono"></p>
                </div>
                <button type="button" onclick="closePiketJournalPageDetailModal()" class="w-7 h-7 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 flex items-center justify-center text-xs">✕</button>
            </div>
            <div id="page-journal-detail-body" class="space-y-3 text-xs">
                <!-- Dynamically populated -->
            </div>
        </div>
    </div>
</div>
