<div class="space-y-3 pb-12">
    <!-- Header Sub-Halaman dengan Navigasi Kembali -->
    <div class="card-elevated p-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <button type="button" onclick="history.back()" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition active:scale-95" title="Kembali ke Tugas">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div>
                <h3 class="text-xs font-black text-slate-800">Supervisi Akademik</h3>
                <p id="spv-academic-year-label" class="text-[10px] text-slate-400">Tahun Ajaran Aktif</p>
            </div>
        </div>
        <button type="button" onclick="loadTasksSupervisions()" class="w-7 h-7 rounded-xl bg-slate-100 hover:bg-indigo-50 text-slate-500 hover:text-indigo-600 flex items-center justify-center transition active:scale-95" title="Muat Ulang">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        </button>
    </div>

    <!-- Ringkasan Metrik Supervisi -->
    <div class="grid grid-cols-3 gap-1.5 text-center">
        <div class="card-elevated p-2 border-indigo-200 bg-indigo-50/40">
            <span class="text-[8px] font-bold text-indigo-700 block">Guru Dinilai</span>
            <p id="stat-spv-teacher-count" class="text-xs font-black text-indigo-900 font-mono">0</p>
        </div>
        <div class="card-elevated p-2 border-purple-200 bg-purple-50/40">
            <span class="text-[8px] font-bold text-purple-700 block">Supervisor</span>
            <p id="stat-spv-supervisor-count" class="text-xs font-black text-purple-900 font-mono">0</p>
        </div>
        <div id="stat-spv-approval-box" class="card-elevated p-2 border-amber-200 bg-amber-50/40">
            <span class="text-[8px] font-bold text-amber-700 block">Pengesahan KS</span>
            <p id="stat-spv-approval-count" class="text-xs font-black text-amber-900 font-mono">0</p>
        </div>
    </div>

    <!-- Tab Navigasi Peran -->
    <div class="flex gap-1 overflow-x-auto pb-1 text-xs font-bold no-scrollbar">
        <button type="button" onclick="switchSupervisionTab('teacher')" id="tab-spv-btn-teacher" class="px-3 py-1.5 rounded-xl bg-slate-900 text-white shrink-0 shadow-xs flex items-center gap-1.5 transition">
            <span>Sebagai Guru</span>
            <span id="badge-tab-teacher" class="px-1.5 py-0.2 rounded-full text-[9px] bg-slate-700 text-white">0</span>
        </button>
        <button type="button" onclick="switchSupervisionTab('supervisor')" id="tab-spv-btn-supervisor" class="px-3 py-1.5 rounded-xl bg-white border border-slate-200 text-slate-600 shrink-0 flex items-center gap-1.5 transition">
            <span>Sebagai Supervisor</span>
            <span id="badge-tab-supervisor" class="px-1.5 py-0.2 rounded-full text-[9px] bg-slate-100 text-slate-700">0</span>
        </button>
        <button type="button" onclick="switchSupervisionTab('approval')" id="tab-spv-btn-approval" class="hidden px-3 py-1.5 rounded-xl bg-white border border-slate-200 text-slate-600 shrink-0 flex items-center gap-1.5 transition">
            <span>Persetujuan KS</span>
            <span id="badge-tab-approval" class="px-1.5 py-0.2 rounded-full text-[9px] bg-amber-100 text-amber-800">0</span>
        </button>
    </div>

    <!-- Container Daftar Supervisi -->
    <div id="list-supervision-container" class="space-y-2.5">
        <div class="text-center py-8 text-xs text-slate-400">Memuat berkas supervisi...</div>
    </div>
</div>
