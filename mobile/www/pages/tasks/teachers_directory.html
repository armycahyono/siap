<div class="space-y-3 pb-24">
    <!-- Header Sub-Halaman dengan Navigasi Kembali -->
    <div class="card-elevated p-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <button type="button" onclick="history.back()" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition active:scale-95" title="Kembali ke Tugas" aria-label="Kembali ke halaman tugas">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div>
                <h3 class="text-xs font-black text-slate-800">Direktori Kontak Guru &amp; GTK</h3>
                <p class="text-[10px] text-emerald-700 font-semibold flex items-center gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    Akses Manajemen (Admin, KS &amp; Waka)
                </p>
            </div>
        </div>
        <div class="flex items-center gap-1.5">
            <button type="button" onclick="loadTeachersDirectory()" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-emerald-50 text-slate-500 hover:text-emerald-600 flex items-center justify-center transition active:scale-95" title="Muat Ulang" aria-label="Muat Ulang Data Guru">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            </button>
        </div>
    </div>

    <!-- Filter & Pencarian Cepat Card -->
    <div class="card-elevated p-3 space-y-2.5">
        <!-- Live Search Input -->
        <div class="relative">
            <input type="text" id="teacher-dir-search" placeholder="Cari nama, NIG, username, atau no HP..." oninput="debounceTeacherDirSearch()" class="w-full text-xs font-medium p-2.5 pl-9 pr-8 rounded-xl border border-slate-200 bg-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 shadow-2xs">
            <svg class="w-4 h-4 text-slate-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <button type="button" id="btn-clear-teacher-dir-search" onclick="clearTeacherDirSearch()" class="hidden absolute right-2.5 top-2.5 text-slate-400 hover:text-slate-600 text-xs font-bold w-5 h-5 rounded-full hover:bg-slate-100 flex items-center justify-center" aria-label="Hapus Pencarian">&times;</button>
        </div>

        <!-- Filter Sub-Kategori Pills -->
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 text-[11px] font-bold">
            <button type="button" data-dir-tab="all" onclick="setTeacherDirSubType('all')" class="dir-tab-pill px-3 py-1 rounded-xl bg-emerald-600 text-white shadow-2xs whitespace-nowrap active:scale-95 transition">
                Semua GTK
            </button>
            <button type="button" data-dir-tab="guru" onclick="setTeacherDirSubType('guru')" class="dir-tab-pill px-3 py-1 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap active:scale-95 transition">
                Guru Saja
            </button>
            <button type="button" data-dir-tab="staf" onclick="setTeacherDirSubType('staf')" class="dir-tab-pill px-3 py-1 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap active:scale-95 transition">
                Staf / TU
            </button>
            <button type="button" data-dir-tab="wa" onclick="setTeacherDirSubType('wa')" class="dir-tab-pill px-3 py-1 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap active:scale-95 transition flex items-center gap-1">
                <span>📱</span><span>Punya WhatsApp</span>
            </button>
        </div>
    </div>

    <!-- Ringkasan Statistik Singkat -->
    <div class="flex items-center justify-between px-1 text-[11px] text-slate-500 font-medium">
        <span id="teacher-dir-summary-text">Memuat data guru...</span>
        <span id="teacher-dir-wa-badge" class="font-bold text-emerald-600 font-mono">-- WA</span>
    </div>

    <!-- Container Daftar Guru (Card List) -->
    <div id="teacher-dir-list-container" class="space-y-2.5">
        <!-- Shimmer Skeleton Loading -->
        <div class="card-elevated p-3.5 space-y-2.5 animate-pulse">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-2xl bg-slate-200"></div>
                <div class="flex-1 space-y-1.5">
                    <div class="h-3 bg-slate-200 rounded w-2/3"></div>
                    <div class="h-2.5 bg-slate-100 rounded w-1/3"></div>
                    <div class="h-2 bg-slate-100 rounded w-1/2"></div>
                </div>
            </div>
            <div class="pt-2 border-t border-slate-100 flex justify-between">
                <div class="h-4 bg-slate-200 rounded w-1/3"></div>
                <div class="h-6 bg-slate-200 rounded w-20"></div>
            </div>
        </div>
    </div>
</div>

<!-- Floating Copy Toast Notification -->
<div id="dir-copy-toast" class="hidden fixed bottom-20 left-1/2 -translate-x-1/2 z-50 px-3.5 py-1.5 bg-slate-900/90 backdrop-blur text-white text-[11px] font-bold rounded-full shadow-lg border border-slate-700 flex items-center gap-1.5 transition-all">
    <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
    <span id="dir-copy-toast-text">Berhasil disalin!</span>
</div>
