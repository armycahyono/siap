<div class="space-y-3 pb-8">
    <!-- Header Sub-Halaman dengan Navigasi Kembali -->
    <div class="card-elevated p-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <button type="button" onclick="history.back()" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition active:scale-95" title="Kembali ke Tugas">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div>
                <h3 class="text-xs font-black text-slate-800">Tim Kedisiplinan</h3>
                <p class="text-[10px] text-slate-400">Verifikasi Pelanggaran &amp; Ketertiban Siswa</p>
            </div>
        </div>
        <button type="button" onclick="loadTasksDiscipline()" class="w-7 h-7 rounded-xl bg-slate-100 hover:bg-rose-50 text-slate-500 hover:text-rose-600 flex items-center justify-center transition active:scale-95" title="Muat Ulang">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        </button>
    </div>

    <!-- Ringkasan Metrik Kedisiplinan -->
    <div class="grid grid-cols-4 gap-1.5 text-center">
        <div class="card-elevated p-2 border-slate-200">
            <span class="text-[8px] font-bold text-slate-500 block">Total</span>
            <p id="stat-disc-total" class="text-xs font-black text-slate-800 font-mono">0</p>
        </div>
        <div class="card-elevated p-2 border-amber-200 bg-amber-50/40">
            <span class="text-[8px] font-bold text-amber-700 block">Verifikasi</span>
            <p id="stat-disc-waiting" class="text-xs font-black text-amber-900 font-mono">0</p>
        </div>
        <div class="card-elevated p-2 border-emerald-200 bg-emerald-50/40">
            <span class="text-[8px] font-bold text-emerald-700 block">Disahkan</span>
            <p id="stat-disc-verified" class="text-xs font-black text-emerald-900 font-mono">0</p>
        </div>
        <div class="card-elevated p-2 border-indigo-200 bg-indigo-50/40">
            <span class="text-[8px] font-bold text-indigo-700 block">Rujuk BK</span>
            <p id="stat-disc-bk" class="text-xs font-black text-indigo-900 font-mono">0</p>
        </div>
    </div>

    <!-- Chip Filter Status -->
    <div class="flex gap-1 overflow-x-auto pb-1 text-xs font-bold no-scrollbar">
        <button type="button" onclick="filterDisciplineCategory('all')" id="filter-disc-all" class="px-2.5 py-1 rounded-lg bg-slate-900 text-white shrink-0 shadow-xs">
            Semua Kasus
        </button>
        <button type="button" onclick="filterDisciplineCategory('menunggu_verifikasi')" id="filter-disc-menunggu_verifikasi" class="px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-slate-600 shrink-0">
            Butuh Verifikasi
        </button>
        <button type="button" onclick="filterDisciplineCategory('terverifikasi')" id="filter-disc-terverifikasi" class="px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-slate-600 shrink-0">
            Disahkan
        </button>
        <button type="button" onclick="filterDisciplineCategory('rujuk_bk')" id="filter-disc-rujuk_bk" class="px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-slate-600 shrink-0">
            Ke Meja BK
        </button>
    </div>

    <!-- Daftar Insiden & Pelanggaran -->
    <div id="list-discipline-container" class="space-y-2">
        <div class="text-center py-8 text-xs text-slate-400">Memuat log pelanggaran...</div>
    </div>
</div>
