<div class="space-y-4">
    <!-- Profile Biodata Card -->
    <div class="card-elevated p-5 text-center">
        <div class="relative w-20 h-20 mx-auto mb-3">
            <img id="prof-avatar" src="assets/logo.png" alt="Avatar" class="w-20 h-20 rounded-full object-cover border-4 border-white shadow-md bg-slate-100">
            <label for="prof-avatar-input" class="absolute bottom-0 right-0 w-7 h-7 bg-blue-600 hover:bg-blue-700 text-white rounded-full flex items-center justify-center cursor-pointer shadow-md transition active:scale-95 border-2 border-white" title="Ganti Foto Profil">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </label>
            <input type="file" id="prof-avatar-input" accept="image/jpeg,image/png,image/webp" class="hidden">
        </div>
        <h3 id="prof-name" class="text-sm font-black text-slate-800 tracking-tight">Memuat nama...</h3>
        <p class="text-[11px] font-mono text-slate-400 mt-0.5">NIP: <span id="prof-nip">-</span></p>

        <div class="mt-4 pt-4 border-t border-slate-100 grid grid-cols-2 gap-3 text-left">
            <div class="p-2.5 bg-slate-50 rounded-xl">
                <span class="text-[9px] font-bold text-slate-400 uppercase">NIGS</span>
                <p id="prof-nigs" class="text-xs font-semibold text-slate-700 font-mono mt-0.5">-</p>
            </div>
            <div class="p-2.5 bg-slate-50 rounded-xl">
                <span class="text-[9px] font-bold text-slate-400 uppercase">No. WhatsApp</span>
                <p id="prof-phone" class="text-xs font-semibold text-slate-700 font-mono mt-0.5">-</p>
            </div>
        </div>

        <div class="mt-2.5 p-2.5 bg-slate-50 rounded-xl text-left">
            <span class="text-[9px] font-bold text-slate-400 uppercase">Email Akun</span>
            <p id="prof-email" class="text-xs font-semibold text-slate-700 mt-0.5">-</p>
        </div>

        <!-- Tombol Aksi Edit Profil & Keamanan -->
        <div class="mt-4 pt-3 border-t border-slate-100 grid grid-cols-2 gap-2">
            <button type="button" onclick="openEditProfileModal()" class="py-2.5 px-3 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-xs">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                Edit Profil
            </button>
            <button type="button" onclick="openEditPasswordModal()" class="py-2.5 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-xs">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                Ganti Sandi
            </button>
        </div>
    </div>

    <!-- Dokumen SK GTK & Penugasan Resmi -->
    <div class="card-elevated p-4">
        <div class="flex items-center justify-between mb-3 border-b border-slate-100 pb-2">
            <div>
                <h4 class="text-xs font-black text-slate-800 uppercase tracking-wider">SK GTK & Penugasan Resmi</h4>
                <p class="text-[10px] text-slate-400 font-medium">Dokumen legalitas penetapan tugas aktif</p>
            </div>
            <span class="text-[10px] font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full">Resmi</span>
        </div>

        <div id="prof-decrees-list">
            <div class="text-center py-4 text-xs text-slate-400">Memuat dokumen SK...</div>
        </div>
    </div>

    <!-- Keluar Sesi -->
    <div class="pt-2">
        <button type="button" onclick="handleLogout()" class="w-full py-2.5 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            Keluar dari SIAP Mobile
        </button>
    </div>

    <!-- 1. Cupertino Modal Sheet: Edit Data Profil -->
    <div id="modal-edit-profile" class="fixed inset-0 z-[60] bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 hidden transition-opacity">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 pb-8 sm:pb-6 shadow-2xl space-y-4 max-h-[85vh] overflow-y-auto">
            <!-- Modal Header & Handle Bar -->
            <div class="text-center relative pb-2 border-b border-slate-100">
                <div class="w-12 h-1 bg-slate-300 rounded-full mx-auto mb-3 sm:hidden"></div>
                <h3 class="text-sm font-black text-slate-800 tracking-tight">Edit Data Profil</h3>
                <p class="text-[11px] text-slate-400 mt-0.5">Perbarui informasi identitas akun Anda</p>
                <button type="button" onclick="closeEditProfileModal()" class="absolute right-0 top-0 text-slate-400 hover:text-slate-600 text-lg font-bold p-1">&times;</button>
            </div>

            <!-- Form Edit Profil -->
            <form id="form-edit-profile" class="space-y-3.5">
                <div>
                    <label for="edit-prof-name" class="block text-[11px] font-bold text-slate-700 mb-1">Nama Lengkap & Gelar</label>
                    <input type="text" id="edit-prof-name" required placeholder="Contoh: Budi Santoso, S.Pd" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                </div>

                <div>
                    <label for="edit-prof-email" class="block text-[11px] font-bold text-slate-700 mb-1">Alamat Email</label>
                    <input type="email" id="edit-prof-email" required placeholder="alamat.email@contoh.com" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                </div>

                <div>
                    <label for="edit-prof-phone" class="block text-[11px] font-bold text-slate-700 mb-1">Nomor WhatsApp / HP</label>
                    <input type="text" id="edit-prof-phone" placeholder="08xxxxxxxxxx" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs text-slate-800 font-mono focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                </div>

                <div class="pt-3 pb-2 flex gap-2">
                    <button type="button" onclick="closeEditProfileModal()" class="w-1/3 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition">
                        Batal
                    </button>
                    <button type="submit" id="btn-save-profile" class="flex-1 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow-md transition flex items-center justify-center gap-1.5">
                        Simpan Perubahan
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 2. Cupertino Modal Sheet: Ganti Kata Sandi -->
    <div id="modal-edit-password" class="fixed inset-0 z-[60] bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 hidden transition-opacity">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 pb-8 sm:pb-6 shadow-2xl space-y-4 max-h-[85vh] overflow-y-auto">
            <!-- Modal Header & Handle Bar -->
            <div class="text-center relative pb-2 border-b border-slate-100">
                <div class="w-12 h-1 bg-slate-300 rounded-full mx-auto mb-3 sm:hidden"></div>
                <h3 class="text-sm font-black text-slate-800 tracking-tight">Ganti Kata Sandi</h3>
                <p class="text-[11px] text-slate-400 mt-0.5">Pastikan kata sandi baru aman dan mudah diingat</p>
                <button type="button" onclick="closeEditPasswordModal()" class="absolute right-0 top-0 text-slate-400 hover:text-slate-600 text-lg font-bold p-1">&times;</button>
            </div>

            <!-- Form Ganti Sandi -->
            <form id="form-edit-password" class="space-y-3.5">
                <div>
                    <label for="edit-pwd-current" class="block text-[11px] font-bold text-slate-700 mb-1">Kata Sandi Saat Ini</label>
                    <input type="password" id="edit-pwd-current" required placeholder="Masukkan kata sandi lama Anda" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                </div>

                <div>
                    <label for="edit-pwd-new" class="block text-[11px] font-bold text-slate-700 mb-1">Kata Sandi Baru</label>
                    <input type="password" id="edit-pwd-new" required minlength="6" placeholder="Minimal 6 karakter" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                </div>

                <div>
                    <label for="edit-pwd-confirm" class="block text-[11px] font-bold text-slate-700 mb-1">Ulangi Kata Sandi Baru</label>
                    <input type="password" id="edit-pwd-confirm" required minlength="6" placeholder="Ketik ulang kata sandi baru" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                </div>

                <div class="pt-3 pb-2 flex gap-2">
                    <button type="button" onclick="closeEditPasswordModal()" class="w-1/3 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition">
                        Batal
                    </button>
                    <button type="submit" id="btn-save-password" class="flex-1 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow-md transition flex items-center justify-center gap-1.5">
                        Perbarui Kata Sandi
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
