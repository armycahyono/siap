<div class="space-y-4">
    <!-- Profile Biodata Card -->
    <div class="card-elevated p-5 text-center">
        <img id="prof-avatar" src="assets/logo.png" alt="Avatar" class="w-20 h-20 rounded-full mx-auto object-cover border-4 border-blue-50 bg-slate-100 shadow-sm mb-3">
        <h3 id="prof-name" class="text-sm font-black text-slate-800 tracking-tight">Memuat nama...</h3>
        <p class="text-[11px] font-mono text-slate-400 mt-0.5">NIP: <span id="prof-nip">-</span></p>

        <div class="mt-4 pt-4 border-t border-slate-100 grid grid-cols-2 gap-3 text-left">
            <div class="p-2.5 bg-slate-50 rounded-xl">
                <span class="text-[9px] font-bold text-slate-400 uppercase">NIGS</span>
                <p id="prof-nigs" class="text-xs font-semibold text-slate-700 font-mono mt-0.5">-</p>
            </div>
            <div class="p-2.5 bg-slate-50 rounded-xl">
                <span class="text-[9px] font-bold text-slate-400 uppercase">No. WhatsApp</span>
                <p id="prof-phone" class="text-xs font-semibold text-slate-700 font-mono mt-0.5">-</p>
            </div>
        </div>

        <div class="mt-2.5 p-2.5 bg-slate-50 rounded-xl text-left">
            <span class="text-[9px] font-bold text-slate-400 uppercase">Email Akun</span>
            <p id="prof-email" class="text-xs font-semibold text-slate-700 mt-0.5">-</p>
        </div>
    </div>

    <!-- Dokumen SK GTK & Penugasan Resmi -->
    <div class="card-elevated p-4">
        <div class="flex items-center justify-between mb-3 border-b border-slate-100 pb-2">
            <div>
                <h4 class="text-xs font-black text-slate-800 uppercase tracking-wider">SK GTK & Penugasan Resmi</h4>
                <p class="text-[10px] text-slate-400 font-medium">Dokumen legalitas penetapan tugas aktif</p>
            </div>
            <span class="text-[10px] font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full">Resmi</span>
        </div>

        <div id="prof-decrees-list">
            <div class="text-center py-4 text-xs text-slate-400">Memuat dokumen SK...</div>
        </div>
    </div>

    <!-- Tombol Keluar Sesi -->
    <div class="pt-2">
        <button type="button" onclick="handleLogout()" class="w-full py-3 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            Keluar dari SIAP Mobile
        </button>
    </div>
</div>
